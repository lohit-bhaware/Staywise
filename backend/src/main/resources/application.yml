server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stayfinder}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:stayfinder}
    password: ${DB_PASSWORD:stayfinder123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  jackson:
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET:YourSuperSecretJwtKeyThatIsAtLeast256BitsLong12345678}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

logging:
  level:
    com.stayfinder: INFO
